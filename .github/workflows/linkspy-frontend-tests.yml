name: linkspy frontend tests

on:
  push:
    branches: [main]
    paths: ["apps/linkspy/**"]
  pull_request:
    paths: ["apps/linkspy/**"]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/linkspy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/linkspy/package-lock.json
      - run: npm ci
      - run: npm test
