# The escalation path in ADR-003: an authentic Apple-font capture, on demand.
#
# devicepreview captures on Linux, where WebKit cannot draw Apple's system
# face, and it says so on the frame. For a page whose text leads with that
# face — dev.apexure.org/LisaMarie, as of the 2026-09-15 census — this runs the
# same capture in WebKit on a macOS runner and on a Linux one, and diffs them,
# so the typography can be checked for real before a client sees it. We
# decided against routing captures to a Mac permanently; this is what replaces
# that, for the pages that need it.
#
# Why Linux as well as macOS: the comparison is the point. The Linux half
# installs the same fonts the Dockerfile does, so it is the container we ship
# rather than a bare runner, and the table says how far it is from the real
# rendering on that page.
#
# Free: GitHub-hosted runners, macOS included, cost nothing on a public repo.
# Artifacts are kept for the repo's retention period (90 days).
#
# Run it from Actions → "Apple fonts: macOS vs Linux capture" → Run workflow,
# with the page's URL. Fixtures in services/devicepreview/fixtures are served
# at http://127.0.0.1:8000/fixtures/<name>.html if you need a control.

name: "Apple fonts: macOS vs Linux capture"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to capture — one whose text leads with an Apple system font"
        required: true
        default: "https://dev.apexure.org/LisaMarie/"
      devices:
        description: "Profile ids — WebKit ones are the point"
        required: true
        default: "iphone-16,ipad-pro-13"

permissions:
  contents: read

jobs:
  capture:
    name: capture on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same set as services/devicepreview/Dockerfile. Without this the
      # Linux half is a different machine from the one we deploy, and the
      # comparison answers nothing.
      - name: Fonts, matching the Dockerfile
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-noto fonts-noto-cjk fonts-noto-color-emoji \
            fonts-dejavu-core fonts-freefont-ttf

      - name: Install
        working-directory: services/devicepreview
        run: |
          pip install -r requirements.txt
          # All three, because --self-check below exercises all three — the
          # same set the Dockerfile installs. Installing only webkit made the
          # self-check fail on chromium and firefox and took the run with it.
          python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium firefox webkit

      # Fails the build if proportional text comes out monospace — the same
      # guard the Dockerfile runs, so a broken Linux font stack cannot quietly
      # become "the difference between the platforms".
      - name: Font-fallback self-check
        working-directory: services/devicepreview
        run: python devicepreview.py --self-check

      # So a fixture in this repo can be the subject. The interesting question
      # is about a font stack, and a fixture isolates it: no webfonts, no
      # images, so a pixel that differs differs because of the face.
      - name: Serve the repo's fixtures
        working-directory: services/devicepreview
        run: |
          nohup python -m http.server 8000 >/dev/null 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/ >/dev/null && break; sleep 0.25; done

      # Inputs go through env, never interpolated into the shell: this repo is
      # public and workflow_dispatch inputs are attacker-controlled text.
      - name: Capture
        working-directory: services/devicepreview
        env:
          URL: ${{ inputs.url }}
          DEVICES: ${{ inputs.devices }}
        run: python devicepreview.py "$URL" --devices "$DEVICES" --out out

      - uses: actions/upload-artifact@v4
        with:
          name: capture-${{ matrix.os }}
          path: services/devicepreview/out

  compare:
    name: diff the two
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capture-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: capture-macos-latest
          path: macos
      - run: pip install pillow
      - name: Measure, and lay them side by side
        run: |
          python - <<'PY'
          import json, os, pathlib
          from PIL import Image, ImageChops
          out = pathlib.Path("side-by-side"); out.mkdir(exist_ok=True)
          rows = []
          lin = json.load(open("linux/report.json")); mac = json.load(open("macos/report.json"))
          lin_f = {d["profile_id"]: d for d in lin["devices"]}
          mac_f = {d["profile_id"]: d for d in mac["devices"]}
          def apple(d):
              f = d.get("fonts") or {}
              if not f.get("appleSystemFontRequested"): return "not asked"
              a = f.get("appleSystemFontAuthentic")
              return {True: "authentic", False: "SUBSTITUTED"}.get(a, "not measured")
          for pid in sorted(set(lin_f) & set(mac_f)):
              a, b = pathlib.Path("macos")/pid/"fold.png", pathlib.Path("linux")/pid/"fold.png"
              if not (a.exists() and b.exists()):
                  rows.append((pid, "one side missing", "", "", "")); continue
              ia, ib = Image.open(a).convert("RGB"), Image.open(b).convert("RGB")
              if ia.size != ib.size:
                  rows.append((pid, f"size differs {ia.size} vs {ib.size}", "", apple(mac_f[pid]), apple(lin_f[pid]))); continue
              diff = ImageChops.difference(ia, ib)
              px = list(diff.getdata()); n = len(px)
              changed = sum(1 for r,g,bl in px if r>25 or g>25 or bl>25)
              canvas = Image.new("RGB", (ia.width*2 + 24, ia.height), (255,255,255))
              canvas.paste(ia, (0,0)); canvas.paste(ib, (ia.width+24, 0))
              canvas.save(out/f"{pid}.png")
              rows.append((pid, f"{100*changed/n:.2f}%", str(diff.getbbox()), apple(mac_f[pid]), apple(lin_f[pid])))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"## WebKit: macOS vs Linux\n\n`{lin['url']}`\n\n")
              fh.write("| profile | differing pixels | changed region | Apple fonts (macOS) | Apple fonts (Linux) |\n")
              fh.write("|---|---|---|---|---|\n")
              for r in rows: fh.write("| " + " | ".join(str(x) for x in r) + " |\n")
              fh.write("\nSide-by-side images are in the `side-by-side` artifact (macOS left, Linux right).\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: side-by-side
          path: side-by-side
