<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixture: a live session's input path</title></head>
<body style="margin:0;background:#ffffff">
<!-- Deliberately still: a screencast is change-driven, so on this page a frame
     arriving AT ALL after the tap is proof the touch landed. The colour change
     makes it visible to a human watching the same test. -->
<div id="z" style="height:100vh;display:grid;place-items:center;font:600 28px system-ui">tap me</div>
<script>
  document.addEventListener('touchstart', () => {
    document.body.style.background = '#cc0000';
    document.getElementById('z').textContent = 'touched';
  }, { passive: true });
</script>
</body></html>
