<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixture: 2x image is sharp enough</title><link rel="stylesheet" href="_base.css"></head>
<body>
<p>A negative control for image-size. The canvas below is drawn as a 200×200 PNG and displayed at 100×100 — a 2x asset. On a 3x phone that is standard practice and must not be reported as soft.</p>
<canvas id="c" width="200" height="200" hidden></canvas>
<img id="pic" width="100" height="100" alt="">
<script>
  const c = document.getElementById('c'), g = c.getContext('2d');
  g.fillStyle = '#48c'; g.fillRect(0, 0, 200, 200); g.fillStyle = '#fff'; g.fillRect(50, 50, 100, 100);
  document.getElementById('pic').src = c.toDataURL('image/png');
</script>
</body></html>
