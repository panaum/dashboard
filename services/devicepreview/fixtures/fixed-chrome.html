<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixture: fixed chrome</title><link rel="stylesheet" href="_base.css">
<style>
  header { position: fixed; top: 0; left: 0; right: 0; height: 30vh; background: #dde; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; height: 10vh; background: #dde; }
  main { padding: 32vh 0 12vh; }
</style></head>
<body>
<header id="top">Fixed header, 30% of the viewport</header>
<main><p>Exactly one defect: a fixed header of 30vh and a fixed footer of 10vh leave only 60% of the screen for content. No links, no small text, nothing overflows.</p></main>
<footer id="bottom">Fixed footer, 10%</footer>
</body></html>
