<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixture: system-ui written as a quoted family name</title>
<!-- Standalone on purpose, as blink-system-font.html. Firefox keeps the
     author's quotes in the computed value: `"system-ui", sans-serif`. -->
<style>body, h1, p, a, button { font-family: "system-ui", sans-serif; }</style></head>
<body><h1>system-ui in quotes</h1><p>The same platform face, spelled as a string.</p></body></html>
